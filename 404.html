<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      const path = window.location.pathname.replace(/\/$/, '');
      const repo = '/kios';
      const redirect = path === repo ? '/kios/' : `${repo}/?p=${encodeURIComponent(window.location.pathname + window.location.search)}`;
      window.location.replace(redirect);
    </script>
  </head>
  <body>Redirecting…</body>
</html>
